# The CPU quota fits exactly one slice of 05-disaggregatedset.yaml (700m).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: disaggregatedset-cq
spec:
  namespaceSelector:
    matchLabels:
      kueue.openshift.io/managed: "true"
  resourceGroups:
  - coveredResources: ["cpu", "memory"]
    flavors:
    - name: disaggregatedset-flavor
      resources:
      - name: "cpu"
        nominalQuota: 1
      - name: "memory"
        nominalQuota: 2Gi
